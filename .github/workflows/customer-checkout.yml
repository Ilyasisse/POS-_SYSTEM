name: Customer checkout regression
on:
  pull_request:
    paths:
      - "src/**"
      - "prisma/**"
      - "tests/**"
      - ".github/workflows/customer-checkout.yml"
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DIRECT_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run prisma:generate
      - name: Customer checkout unit tests
        run: node --import tsx --test tests/unit/customer-mobile-money-checkout.test.ts tests/unit/customer-checkout-review.test.ts tests/unit/customer-order-draft.test.ts tests/unit/customer-order-progress.test.ts tests/unit/macrodroid-payment-inbox.test.ts tests/unit/payment-webhook.test.ts
      - name: Customer checkout modifier API regression
        run: node --test tests/integration/customer-checkout-modifier-validation.test.mjs
      - name: Database migration tests
        run: node --test tests/integration/customer-mobile-checkout-migration.test.mjs tests/integration/customer-receipt-assignment-migration.test.mjs tests/integration/customer-fulfillment-presence-migration.test.mjs
      - name: Type check
        run: npx tsc --noEmit
