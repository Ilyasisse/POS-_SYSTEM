name: POS workflow tests

on:
  pull_request:
    paths:
      - "src/**"
      - "prisma/**"
      - "tests/**"
      - "package*.json"
      - "playwright.config.ts"
      - ".github/workflows/workflow-tests.yml"
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAFE_POS_TEST_SCOPE: ${{ github.event_name == 'pull_request' && 'core' || 'all' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - run: npm run test:e2e
